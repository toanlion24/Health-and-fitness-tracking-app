name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: health_fitness_test
          MYSQL_USER: health_fitness
          MYSQL_PASSWORD: health_fitness
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        env:
          DATABASE_URL: "mysql://health_fitness:health_fitness@127.0.0.1:3306/health_fitness_test"
          JWT_SECRET: test-jwt-secret-key
          JWT_REFRESH_SECRET: test-jwt-refresh-secret
          BCRYPT_ROUNDS: "4"
          EXPO_ACCESS_TOKEN: test-token
        run: npm run test

      - name: Run integration tests
        env:
          DATABASE_URL: "mysql://health_fitness:health_fitness@127.0.0.1:3306/health_fitness_test"
          JWT_SECRET: test-jwt-secret-key
          JWT_REFRESH_SECRET: test-jwt-refresh-secret
          BCRYPT_ROUNDS: "4"
          EXPO_ACCESS_TOKEN: test-token
          RUN_INTEGRATION: "1"
        run: npm run test:integration

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: backend

  mobile:
    name: Mobile Tests & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test -- --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: mobile

  lint-all:
    name: Lint All Projects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install ESLint and Prettier
        run: npm install -g eslint prettier

      - name: Check backend formatting
        run: |
          cd backend
          npx prettier --check "src/**/*.ts"

      - name: Check mobile formatting
        run: |
          cd mobile
          npx prettier --check "src/**/*.{ts,tsx}"
